name: Release

# v로 시작하는 태그(v1.0.1 등)를 푸시하면 윈도우/맥 빌드를 만들어
# 해당 버전의 GitHub Release(초안)에 자동 첨부합니다.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 현재 OS용 타깃을 빌드하고 GitHub Release(초안)에 업로드
      - name: Build & publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 코드 서명 안 함(개인 배포) — 자동 서명 탐색 끄기
          CSC_IDENTITY_AUTODISCOVERY: false

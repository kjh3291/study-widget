name: Release

# v로 시작하는 태그(v1.0.3 등)를 푸시하면 윈도우/맥 빌드를 만들어
# 하나의 GitHub Release(초안)에 모아서 첨부합니다.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 1단계: 각 OS에서 빌드해 아티팩트로만 업로드 (릴리스에 직접 올리지 않음 → 중복 방지)
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (no publish)
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTODISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: ignore

  # 2단계: 모든 아티팩트를 모아 하나의 Release(초안)로 게시
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          files: artifacts/**/*
